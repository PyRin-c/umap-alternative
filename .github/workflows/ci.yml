name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.10.8'
      - run: uv python install
      - run: uv sync --locked
      - run: cargo fmt --all -- --check
      - run: uv run --no-sync cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: uv run --no-sync cargo test --workspace --locked
      - run: uv run --no-sync pytest
      - run: uv run --no-sync maturin build --release --locked --interpreter python --out target/wheel-verification
      - name: Verify the installed wheel and license
        shell: pwsh
        run: |
          $check = @'
          from importlib.metadata import distribution
          from umap_alternative import __version__

          package = distribution("umap-alternative")
          assert __version__ == package.version
          assert package.metadata["License-Expression"] == "MIT"
          assert "LICENSE" in package.metadata.get_all("License-File", [])
          assert any(
              entry.as_posix().endswith(".dist-info/licenses/LICENSE")
              and entry.locate().is_file()
              for entry in package.files
          )
          '@
          $wheels = @(Get-ChildItem -Path target/wheel-verification -Filter *.whl -File)
          if ($wheels.Count -ne 1) {
            throw "Expected exactly one wheel in target/wheel-verification, found $($wheels.Count)."
          }
          $python = (Get-Content .python-version -Raw).Trim()
          $arguments = @(
            '--no-cache'
            'run'
            '--no-project'
            '--isolated'
            '--python'
            $python
            "--with=$($wheels[0].FullName)"
            '--'
            'python'
            '-I'
            '-'
          )
          $check | & uv @arguments

  reference:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.10.8'
      - run: uv python install
      - run: uv run --project reference --locked python -I reference/generate_fixture.py
