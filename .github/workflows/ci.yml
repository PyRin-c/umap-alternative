name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      release_assets:
        type: boolean
        default: false
      source_sha:
        type: string

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_CORETYPE: Haswell
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
      NPY_DISABLE_CPU_FEATURES: ${{ matrix.os == 'ubuntu-24.04' && 'X86_V4,AVX512_ICL,AVX512_SPR' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.10.8'
      - run: uv python install
      - run: uv sync --locked
      - run: cargo fmt --all -- --check
      - run: uv run --no-sync cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: uv run --no-sync cargo test --workspace --locked
      - run: uv run --no-sync pytest
      - run: uv run --no-sync python scripts/release_build.py cargo build --release --locked -p umap-capi
      - name: Verify the C ABI on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for test in c_smoke c_inverse_smoke; do
            cc -std=c11 -Wall -Wextra -Werror -I crates/umap-capi/include \
              "crates/umap-capi/tests/$test.c" -L target/release -Wl,-rpath,'$ORIGIN' \
              -lumap_capi -o "target/release/$test"
            "target/release/$test"
          done
      - name: Package and verify the Windows C ABI
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows-cabi.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.release_assets && runner.os == 'Windows'
        with:
          name: release-cabi-win-x64
          path: target/cabi-release/*.zip
          if-no-files-found: error

  python-wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
        python: ['3.10', '3.11', '3.12', '3.13.12', '3.14', '3.15']
        include:
          - os: windows-2025
            compatibility: pypi
          - os: ubuntu-24.04
            compatibility: manylinux_2_34
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.9'
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --no-install-project
      - run: uv run --no-sync python scripts/release_build.py maturin build --release --locked --compatibility ${{ matrix.compatibility }} --interpreter python --out target/wheel-verification
      - name: Install and verify the wheel
        shell: pwsh
        run: |
          $check = @'
          from importlib.metadata import distribution
          from umap_alternative import __version__

          package = distribution("umap-alternative")
          assert __version__ == package.version
          assert package.metadata["License-Expression"] == "MIT"
          assert "LICENSE" in package.metadata.get_all("License-File", [])
          assert any(
              entry.as_posix().endswith(".dist-info/licenses/LICENSE")
              and entry.locate().is_file()
              for entry in package.files
          )
          '@
          $wheels = @(Get-ChildItem -Path target/wheel-verification -Filter *.whl -File)
          if ($wheels.Count -ne 1) {
            throw "Expected exactly one wheel in target/wheel-verification, found $($wheels.Count)."
          }
          uv pip install --python .venv --no-deps ($wheels[0].FullName)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $check | uv run --no-sync python -I -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-sync python -I -m pytest -q tests/test_native.py tests/test_python_support.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.release_assets
        with:
          name: release-wheel-${{ matrix.os }}-${{ matrix.python }}
          path: target/wheel-verification/*.whl
          if-no-files-found: error

  reference:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.10.8'
      - run: uv python install
      - run: uv run --project reference --locked python -I reference/generate_fixture.py
