[build-system]
requires = ["maturin==1.16.0"]
build-backend = "maturin"

[project]
name = "umap-alternative"
description = "An independent Rust implementation of UMAP"
readme = "Readme.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version"]
dependencies = [
    "numba>=0.61",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.6",
]

[project.urls]
Repository = "https://github.com/PyRin-c/umap-alternative"
Releases = "https://github.com/PyRin-c/umap-alternative/releases"

[dependency-groups]
dev = ["maturin==1.16.0", "pytest"]

[tool.maturin]
bindings = "pyo3"
manifest-path = "crates/umap-python/Cargo.toml"
python-source = "python"
module-name = "umap_alternative._native"
locked = true

[tool.maturin.sbom]
rust = false

[tool.pytest.ini_options]
testpaths = ["tests"]
