name: Prepare GitHub Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  version:
    if: github.event_name == 'workflow_dispatch' || !github.event.deleted
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the release tag and notes
        run: |
          [[ "$GITHUB_REF" == refs/tags/* ]]
          python3 scripts/release_assets.py "$GITHUB_REF_NAME"

  build:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      release_assets: true

  draft:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: target/release-assets
          merge-multiple: true
      - name: Validate the release assets and calculate their checksums
        run: python3 scripts/release_assets.py "$GITHUB_REF_NAME" --assets target/release-assets
      - name: Attach the assets to a draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')
          if grep -Fxq "$GITHUB_REF_NAME" <<< "$releases"; then
            echo "A release already exists for $GITHUB_REF_NAME."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" target/release-assets/* \
            --verify-tag --draft --prerelease \
            --title "umap-alternative $GITHUB_REF_NAME preview" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
