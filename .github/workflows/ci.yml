name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.10.8'
      - run: uv python install
      - run: uv sync --locked
      - run: cargo fmt --all -- --check
      - run: uv run --no-sync cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: uv run --no-sync cargo test --workspace --locked
      - run: uv run --no-sync pytest
      - run: cargo build --release --locked -p umap-capi
      - name: Verify the C ABI on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for test in c_smoke c_inverse_smoke; do
            cc -std=c11 -Wall -Wextra -Werror -I crates/umap-capi/include \
              "crates/umap-capi/tests/$test.c" -L target/release -Wl,-rpath,'$ORIGIN' \
              -lumap_capi -o "target/release/$test"
            "target/release/$test"
          done
      - name: Verify the C ABI on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio with the C++ toolchain was not found.' }
          Import-Module (Join-Path $vs 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          foreach ($test in 'c_smoke', 'c_inverse_smoke') {
            & cl.exe /nologo /std:c11 /W4 /WX /Icrates/umap-capi/include `
              "crates/umap-capi/tests/$test.c" "/Fotarget/release/$test.obj" `
              "/Fetarget/release/$test.exe" target/release/umap_capi.dll.lib
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & "./target/release/$test.exe"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  python-wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
        python: ['3.10', '3.11', '3.12', '3.13.12', '3.14', '3.15']
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.9'
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --no-install-project
      - run: uv run --no-sync maturin build --release --locked --compatibility pypi --interpreter python --out target/wheel-verification
      - name: Install and verify the wheel
        shell: pwsh
        run: |
          $check = @'
          from importlib.metadata import distribution
          from umap_alternative import __version__

          package = distribution("umap-alternative")
          assert __version__ == package.version
          assert package.metadata["License-Expression"] == "MIT"
          assert "LICENSE" in package.metadata.get_all("License-File", [])
          assert any(
              entry.as_posix().endswith(".dist-info/licenses/LICENSE")
              and entry.locate().is_file()
              for entry in package.files
          )
          '@
          $wheels = @(Get-ChildItem -Path target/wheel-verification -Filter *.whl -File)
          if ($wheels.Count -ne 1) {
            throw "Expected exactly one wheel in target/wheel-verification, found $($wheels.Count)."
          }
          uv pip install --python .venv --no-deps ($wheels[0].FullName)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $check | uv run --no-sync python -I -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-sync python -I -m pytest -q tests/test_native.py tests/test_python_support.py

  reference:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.10.8'
      - run: uv python install
      - run: uv run --project reference --locked python -I reference/generate_fixture.py
